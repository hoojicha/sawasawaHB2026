<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Happy Birthday</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #0b1f17;
    color: #00ff9c;
    font-family: 'Arial Black', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* ネオン背景 */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: repeating-linear-gradient(
        135deg,
        transparent,
        transparent 50px,
        rgba(0,255,156,0.05) 50px,
        rgba(0,255,156,0.05) 100px
    );
    animation: bgmove 12s linear infinite;
}

@keyframes bgmove {
    from { transform: translate(0,0); }
    to { transform: translate(-200px,-200px); }
}

.container {
    text-align: center;
    z-index: 2;
}

/* メイン */
.title {
    font-size: 3em;
    text-shadow: 0 0 10px #00ff9c, 0 0 20px #00ff9c;
}

/* ACE風 */
.rank-text {
    font-size: 5em;
    margin-top: 20px;
    opacity: 0;
    transform: scale(0.5);
    transition: 0.3s;
}

/* 表示時 */
.show {
    opacity: 1;
    transform: scale(1);
}

/* CLUTCH色変化 */
.clutch {
    color: #00e1ff;
    text-shadow: 0 0 15px #00e1ff;
}

/* ボタン */
button {
    margin-top: 30px;
    padding: 12px 25px;
    border: 2px solid #00ff9c;
    background: transparent;
    color: #00ff9c;
    cursor: pointer;
}

button:hover {
    background: #00ff9c;
    color: #0b1f17;
}

/* パーティクル */
.particle {
    position: absolute;
    width: 5px;
    height: 5px;
    background: #00ff9c;
    border-radius: 50%;
    animation: explode 1s forwards;
}

@keyframes explode {
    to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
    }
}

/* ランク表示 */
.rank {
    margin-top: 15px;
    font-size: 1.2em;
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">
    <div class="title">HAPPY BIRTHDAY</div>
    <div>by ヴァロ部</div>

    <div id="effect" class="rank-text">ACE</div>

    <div class="rank">PLATINUM PLAYER</div>

    <button onclick="triggerEffect()">もっと祝う</button>
</div>

<script>
let toggle = true;

function triggerEffect() {
    const effect = document.getElementById("effect");

    // ACE ⇄ CLUTCH切り替え
    if (toggle) {
        effect.textContent = "ACE";
        effect.classList.remove("clutch");
    } else {
        effect.textContent = "CLUTCH";
        effect.classList.add("clutch");
    }

    effect.classList.add("show");

    setTimeout(() => {
        effect.classList.remove("show");
    }, 1000);

    toggle = !toggle;

    burst();
}

// 爆発演出（撃ち合い強者感）
function burst() {
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    for (let i = 0; i < 80; i++) {
        const p = document.createElement("div");
        p.className = "particle";

        const angle = Math.random() * 2 * Math.PI;
        const distance = Math.random() * 200;

        p.style.left = centerX + "px";
        p.style.top = centerY + "px";

        p.style.setProperty("--x", Math.cos(angle) * distance + "px");
        p.style.setProperty("--y", Math.sin(angle) * distance + "px");

        document.body.appendChild(p);

        setTimeout(() => p.remove(), 1000);
    }
}
</script>

</body>
</html>

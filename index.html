<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Happy Birthday</title>

<style>
body {
    margin: 0;
    background: #0f1923;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* マウスライト */
.light {
    position: fixed;
    width: 400px;
    height: 400px;
    pointer-events: none;
    background: radial-gradient(circle, rgba(255,70,85,0.25), transparent 60%);
    transform: translate(-50%, -50%);
}

/* レイアウト */
.wrapper {
    display: flex;
    height: 100vh;
}

/* メイン */
.main {
    flex: 1;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* フレンド欄（右） */
.sidebar {
    width: 260px;
    background: #111823;
    border-left: 2px solid #ff4655;
    padding: 15px;
}

.sidebar h2 {
    color: #ff4655;
    font-size: 14px;
}

/* 自分（強調） */
.me {
    padding: 10px;
    margin: 8px 0;
    background: #1f2d3d;
    border-left: 4px solid #ff4655;
    font-weight: bold;
}

/* フレンド */
.friend {
    padding: 8px;
    margin: 5px 0;
    background: #1a2430;
    border-left: 3px solid #00f0ff;
}
    /* オフラインのフレンド */
.offline-friend {
    padding: 8px;
    margin: 5px 0;
    background: #1a2430;
    border-left: 3px solid #808080;
}

/* エージェント背景 */
.agent-bg {
    position: absolute;
    width: 500px;
    height: 700px;
    background: radial-gradient(circle at center, rgba(0,200,255,0.2), transparent 70%);
    filter: blur(40px);
    opacity: 0.6;
}

/* カード */
.card {
    width: 520px;
    background: linear-gradient(145deg, #1a2430, #0f1923);
    border: 2px solid #ff4655;
    padding: 20px;
    position: relative;
    z-index: 2;
}

/* 名前 */
.name {
    font-size: 28px;
    color: #ff4655;
}

/* レベル */
.level {
    font-size: 14px;
    color: #aaa;
}

/* メッセージ */
.message {
    margin-top: 40px;
    text-align: center;
    font-size: 22px;
}

/* ボタン */
.ready {
    margin-top: 30px;
    text-align: center;
}

.ready button {
    padding: 12px 40px;
    font-size: 18px;
    border: none;
    background: #ff4655;
    color: white;
    cursor: pointer;
}

.ready button:hover {
    background: #ff6b77;
}

/* ACE */
.effect {
    text-align: center;
    font-size: 60px;
    color: #ff4655;
    opacity: 0;
}

.show {
    animation: pop 1s;
}

@keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { opacity: 0; }
}
</style>
</head>

<body>

<div class="light" id="light"></div>

<div class="wrapper">

    <!-- メイン -->
    <div class="main">

        <div class="agent-bg"></div>

        <div class="card">
            <div class="name">さわさわ</div>
            <div class="level">LEVEL 309</div>

            <div class="message">
                🎉 HAPPY BIRTHDAY 🎉<br>
                by ヴァロ部
            </div>

            <div id="effect" class="effect">ACE</div>

            <div class="ready">
                <button onclick="play()">READY</button>
            </div>
        </div>

    </div>

    <!-- フレンド欄（右） -->
    <div class="sidebar">
        <h2>PARTY</h2>

        <div class="me">さわさわ</div>

        <div class="friend">アンバランデンデレンドンドロン</div>
        <div class="friend">GON</div>
        <div class="friend">センチネルの申し子</div>
        <div class="friend">大ライス小</div>
        <div class="friend">鬱くん</div>
        <div class="offline-friend">hoojichalatte</div>
        <div class="offline-friend">夜大自郎</div>
        <div class="offline-friend">キャシィ岸本</div>
        <div class="offline-friend">キャシイ坂本</div>
        <div class="offline-friend">10happy</div>
        <div class="offline-friend">うりうり</div>
        <div class="offline-friend">メダロット</div>
        <div class="offline-friend">よよよ</div>
        <div class="offline-friend">461Pochi</div>
        <div class="offline-friend">pov</div>
        <div class="offline-friend">RON</div>
    </div>

</div>

<script>
// マウスライト
const light = document.getElementById("light");
document.addEventListener("mousemove", e => {
    light.style.left = e.clientX + "px";
    light.style.top = e.clientY + "px";
});

// ACE / CLUTCH
let toggle = true;
function play() {
    const e = document.getElementById("effect");

    e.textContent = toggle ? "ACE" : "CLUTCH";

    e.classList.remove("show");
    void e.offsetWidth;
    e.classList.add("show");

    toggle = !toggle;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Happy Birthday</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
    }

    h1 {
        font-size: 3em;
        animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
        from {
            text-shadow: 0 0 10px #fff, 0 0 20px #ff4da6;
        }
        to {
            text-shadow: 0 0 20px #fff, 0 0 40px #ff1a75;
        }
    }

    .container {
        z-index: 2;
    }

    .subtitle {
        margin-top: 20px;
        font-size: 1.5em;
        opacity: 0.9;
    }

    /* 花火風エフェクト */
    .firework {
        position: absolute;
        width: 5px;
        height: 5px;
        background: white;
        border-radius: 50%;
        animation: explode 1.5s ease-out infinite;
    }

    @keyframes explode {
        0% {
            transform: scale(0);
            opacity: 1;
        }
        100% {
            transform: scale(15);
            opacity: 0;
        }
    }

    /* キラキラ */
    .sparkle {
        position: absolute;
        width: 3px;
        height: 3px;
        background: white;
        border-radius: 50%;
        animation: sparkle 3s linear infinite;
    }

    @keyframes sparkle {
        from {
            transform: translateY(0);
            opacity: 1;
        }
        to {
            transform: translateY(-100vh);
            opacity: 0;
        }
    }

    button {
        margin-top: 30px;
        padding: 10px 20px;
        font-size: 1em;
        border: none;
        border-radius: 20px;
        background: white;
        color: #ff4da6;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #ff4da6;
        color: white;
    }
</style>
</head>

<body>

<div class="container">
    <h1>🎉 お誕生日おめでとう！🎉</h1>
    <div class="subtitle">by ヴァロ部</div>
    <button onclick="moreFireworks()">もっと祝う</button>
</div>

<script>
    // 花火生成
    function createFirework() {
        const fw = document.createElement("div");
        fw.className = "firework";
        fw.style.left = Math.random() * window.innerWidth + "px";
        fw.style.top = Math.random() * window.innerHeight + "px";
        fw.style.background = `hsl(${Math.random()*360},100%,70%)`;
        document.body.appendChild(fw);

        setTimeout(() => fw.remove(), 1500);
    }

    setInterval(createFirework, 300);

    function moreFireworks() {
        for (let i = 0; i < 20; i++) {
            setTimeout(createFirework, i * 50);
        }
    }

    // キラキラ生成
    function createSparkle() {
        const sp = document.createElement("div");
        sp.className = "sparkle";
        sp.style.left = Math.random() * window.innerWidth + "px";
        sp.style.top = window.innerHeight + "px";
        document.body.appendChild(sp);

        setTimeout(() => sp.remove(), 3000);
    }

    setInterval(createSparkle, 100);
</script>

</body>
</html>
